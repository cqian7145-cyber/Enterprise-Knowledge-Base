name: BarOS checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: node --check web/app.js
      - run: node tests/test_web.cjs
      - run: node tests/test_operations_web.cjs
      - run: node --check web/commerce.js
      - run: node tests/test_commerce_web.cjs
      - run: node --check web/org.js
      - run: node tests/test_org_web.cjs
