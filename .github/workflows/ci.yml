name: BarOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    name: Unit and DOM checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q --junitxml=test-results/unit.xml
      - run: node --check web/app.js
      - run: node tests/test_web.cjs
      - run: node tests/test_operations_web.cjs
      - run: node --check web/commerce.js
      - run: node tests/test_commerce_web.cjs
      - run: node --check web/org.js
      - run: node tests/test_org_web.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-and-recovery-evidence
          path: test-results/
          retention-days: 7
  e2e:
    name: Chromium ${{ matrix.profile }} acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-e2e.lock
      - run: python -m playwright install --with-deps --no-shell chromium
      - name: Real cookies, UI clicks, scope and lifecycle acceptance
        run: python -m pytest --run-e2e --e2e-profile=${{ matrix.profile }} tests/e2e -q --junitxml=test-results/e2e-${{ matrix.profile }}.xml
      - name: Reject missing, failed or skipped acceptance cases
        run: python tools/check_e2e_report.py test-results/e2e-${{ matrix.profile }}.xml --profile ${{ matrix.profile }} --output test-results/e2e-gate-${{ matrix.profile }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-${{ matrix.profile }}-evidence
          path: test-results/
          retention-days: 7
